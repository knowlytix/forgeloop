# Root ruff configuration for the forgeloop monorepo.
#
# Lint scope is the importable topic packages (agentlab, gmstest, book_kit,
# reasonloop, knowlytix_contrib), their tests, and the notebooks/ trees. The
# scripts/ trees and data/companion dirs are runnable book glue / fixtures, not
# maintained code, and stay out of the gate.
line-length = 100
target-version = "py312"

extend-exclude = [
    # Topic scripts/ are book glue ported verbatim; repo-root scripts/ is
    # maintained tooling and stays in the gate.
    "beyond-*/code/scripts",
    "**/benchmarks",
    "**/apps",
    "**/catalogs",
    "**/configs",
    "**/data",
    "**/doe_tracing_store",
]

[lint]
# Select the rule set EXPLICITLY. Relying on ruff's *default* selection is a
# trap: ruff 0.16 broadly expanded that default (pulling in BLE, SIM, S, C4, UP,
# RUF, …), which turns a routine `pip install -U ruff` in CI into 469 findings
# on unchanged code. Naming the rules keeps lint deterministic across ruff
# upgrades — new families are adopted deliberately, never by a ruff release.
#   E4/E7/E9 + F — the classic default: real-bug rules (F401, F821, E712, …).
#   I            — import sorting (isort). Applied to package code; the
#                  notebooks opt out below.
select = ["E4", "E7", "E9", "F", "I"]

[lint.per-file-ignores]
# Notebooks are teaching material. One-line imports (E401), imports after prose
# (E402), compact demo statements (E701/E702), lambdas (E731) and short names
# like `l`/`I` (E741) are deliberate style, not defects. Cells are also written
# to run standalone, so a name re-imported in a later cell (F811) is intentional,
# not a bug. Import *order* (I001) is likewise pedagogical — a chapter introduces
# imports in the order it explains them — so isort is not applied here. Real dead
# code (F401 unused imports, F841 unused vars) is still enforced so notebooks
# don't accumulate clutter.
"**/notebooks/**" = ["E401", "E402", "E701", "E702", "E731", "E741", "F811", "I001"]
