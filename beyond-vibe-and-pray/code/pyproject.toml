[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reasonloop"
version = "0.0.1"
description = "ReasonLoop: a semantic execution substrate — LLM as compiler and grounded synthesizer over a GMS knowledge substrate (companion code for Beyond Vibe and Pray)."
requires-python = ">=3.12"
dependencies = [
    "playwright>=1.60",
    "playwright-stealth>=2.0",
    "markdownify>=0.13",
    "beautifulsoup4>=4.12",
]

# The geometric substrate (knowlytix.core / .knowledge / .harness) is the
# licensed dependency. It is on PyPI (`pip install knowlytix`) but gated by a
# runtime license key (~/.knowlytix/license.key; sign up at
# https://knowlytix.ai/signup/), so it is not declared as a hard dependency here.

[tool.setuptools.packages.find]
include = ["reasonloop*"]
