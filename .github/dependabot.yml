# Keeps the CI actions current. Actions are the supply-chain surface that
# matters most here: a compromised or abandoned action runs with the workflow
# token on every push. The Python packages are deliberately not tracked — the
# books pin loose ranges on purpose so readers install current versions, and a
# weekly bump PR against four pyprojects would be noise.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
