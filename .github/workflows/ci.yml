name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel redundant runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The licensed `knowlytix` substrate is not available in CI, and no notebook
  # or test may reach the network for models. Force HF offline as a guard.
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

# Least-privilege token; CI only reads the repo.
permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install ruff
        # Unpinned is safe: ruff.toml (and the per-topic [tool.ruff.lint]
        # blocks) select the rule set explicitly, so a ruff release that expands
        # its *default* selection — as 0.16 did — cannot redden CI on unchanged
        # code.
        run: pip install -U pip ruff
      - name: Run ruff
        run: ruff check .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # This repo is public, and a pushed credential is leaked the moment it
      # lands -- deleting the commit does not undo it. GitHub's own secret
      # scanning catches vendor tokens after the push; this fails the PR before
      # it, and covers the two cases no vendor pattern knows about: a knowlytix
      # licence key, and an absolute path off a contributor's machine.
      # Stdlib only, no extra pip install needed.
      - name: Scan for committed secrets
        run: python scripts/secret_scan.py

  notebooks:
    name: Notebook output guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # Executed notebook output must not be committed: it bloats the repo,
      # makes diffs unreadable, and re-renders stale results on GitHub. A local
      # nbstripout hook only protects contributors who installed it, so gate it
      # here. Fix with `python scripts/notebook_outputs.py --strip`.
      # Stdlib only, no extra pip install needed.
      - name: Assert no committed notebook output
        run: python scripts/notebook_outputs.py --check

  assembled:
    name: forgeloop/ matches the books
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The three beyond-*/ book directories are the source of truth; the
      # forgeloop/ package is assembled from them and committed as a build
      # artifact. Editing forgeloop/ by hand would be silently undone by the
      # next assembly, so gate it: rebuild into a temp dir and diff.
      # Fix with `python scripts/build_forgeloop.py` and commit the result.
      # Stdlib only, no extra pip install needed.
      - name: Assert forgeloop/ is in sync with the books
        run: python scripts/build_forgeloop.py --package --check

  test:
    name: Typecheck + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install CPU-only torch
        # CPU wheels keep install ~2 min instead of pulling full CUDA torch.
        run: |
          pip install -U pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
      - name: Install forgeloop and the book packages (public deps only)
        # One package now: the root pyproject builds `forgeloop`. The book
        # packages are installed too because the test suites import them by
        # their book-local names (agentlab, gmstest) -- the books are the
        # source under test, forgeloop is the assembled distribution of it.
        #
        # Deliberately NOT `make install`, which also installs
        # beyond-chunk-and-pray. That book declares knowlytix as a core
        # dependency, and knowlytix IS on PyPI (free to install, licence-gated
        # at runtime), so `make install` pulls it in along with torch and
        # transformers. Here we want it absent: the suites assert that
        # knowlytix-gated tests skip cleanly, and the install stays quick.
        run: |
          pip install mypy pytest
          pip install -e ".[dev]"
          pip install -e beyond-prompt-and-pray/code
          pip install -e beyond-ship-and-pray/code
      - name: Mypy (advisory)
        # Non-blocking until types stabilize.
        run: mypy --ignore-missing-imports forgeloop || true
      - name: Pytest
        # Scoped to the book test suites on purpose: collecting from the repo
        # root would also walk forgeloop/, which is the same code under a
        # second name, and every test would be gathered twice.
        # Exit 5 (no tests collected) is a no-op success, not a failure.
        run: |
          pytest -q \
            beyond-prompt-and-pray/code/tests \
            beyond-ship-and-pray/code/tests \
            || [ $? -eq 5 ]
