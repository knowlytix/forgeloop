[project]
name = "agentlab"
version = "0.1.0"
description = "Beyond Prompt and Pray — companion library for Building Agentic AI Systems from Scratch"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Knowlytix" }]
keywords = ["agents", "agentic-ai", "llm", "governance", "gms", "banking"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
]

# Core install: the loop, typed actions, tools, gates, audit, planning, memory,
# evaluation, reasoning and multi-agent all run on just these.
dependencies = [
    "pydantic>=2.0",
    "numpy",
]

[project.optional-dependencies]
# Open-weight model tools: classifier head, Qwen adapters, the draft LoRA.
ml = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.30",
]
# Optional hosted-model adapter (notebooks default to the local Qwen / MockLM).
anthropic = ["anthropic>=0.30"]
notebooks = ["jupyterlab", "matplotlib", "pandas"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "black"]

# GMS-backed features — the geometric plausibility gate, Exact Numerical Memory,
# the regulatory guard, the policy Graph-RAG store and the DOE test harness — run
# on the LICENSED `knowlytix` package. knowlytix is NOT on public PyPI and a
# license is required; install it from the Knowlytix index (see the README,
# "GMS / Knowlytix (licensed)"). `agentlab` imports it lazily, so everything
# outside those features works without it.
gms = ["knowlytix", "pandas"]

# Everything pip-installable from public indexes (deliberately excludes `gms`,
# which is license-gated and installed separately).
all = [
    "torch>=2.0",
    "transformers>=4.40",
    "peft>=0.10",
    "accelerate>=0.30",
    "anthropic>=0.30",
    "jupyterlab",
    "matplotlib",
    "pandas",
]

[project.urls]
Homepage = "https://github.com/knowlytix/forgeloop"
Repository = "https://github.com/knowlytix/forgeloop"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agentlab*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
