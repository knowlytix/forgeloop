# Atomic policy obligations for the complaint-handling prototype.
# Each atom is a small, auditable unit: when it is TRIGGERED (by the facts a
# complaint alleges), the required_actions and evidence_needed follow. The
# entailment layer decides applicability (entailed / contradicted / missing-facts
# / not-applicable) against the structured complaint facts -- it does NOT match on
# text similarity. `policy` is the high-level domain scored against expected_policy.

- atom_id: DEP-OD-FEE-001
  policy: overdraft
  product_scope: [checking_account]
  trigger_conditions:
    - the customer was charged an overdraft or NSF fee, OR disputes such a fee
    - the event concerns a fee on a deposit/checking account
  evidence_needed: [fee_amount, transaction_date, account_type]
  required_actions: [verify fee against fee schedule, assess reversal eligibility]
  exclusions: [credit card fee, loan late fee]
  regulation: regulation_e

- atom_id: DEP-FEE-REV-001
  policy: fee_reversal
  product_scope: [checking_account]
  trigger_conditions:
    - the customer requests a fee be waived, reversed, refunded, or removed
    - a remedy of refund/reversal is requested for a charged fee
  evidence_needed: [fee_amount, prior_reversals_this_year, account_tenure]
  required_actions: [check representative reversal cap, apply or escalate reversal]
  exclusions: [dispute of an unauthorized transaction (not a fee)]
  regulation: internal_fee_reversal

- atom_id: DEP-EFT-DISPUTE-001
  policy: disputes
  product_scope: [checking_account, credit_card]
  trigger_conditions:
    - the customer alleges a transaction they did not authorize or do not recognize
    - the customer reports a duplicate, fraudulent, or erroneous charge to dispute
  evidence_needed: [transaction_amount, transaction_date, merchant, authorization_statement]
  required_actions: [open error investigation, assess provisional credit, notify outcome]
  exclusions: [a fee charged by the bank itself, a check deposit hold]
  regulation: regulation_e_or_z

- atom_id: DEP-CLOSE-001
  policy: account_closure
  product_scope: [checking_account]
  trigger_conditions:
    - the customer asks to close, cancel, or shut down their account
  evidence_needed: [account_type, identity_verification]
  required_actions: [verify identity, process closure, give bank-initiated notice if applicable]
  exclusions: [account access/login problem (not a closure request)]
  regulation: internal_account_closure

- atom_id: REG-ESC-001
  policy: regulatory_escalation
  product_scope: [checking_account, credit_card, mortgage, loan]
  trigger_conditions:
    - the complaint alleges an unfair, deceptive, or abusive practice (UDAAP)
    - a mortgage servicing error is alleged (Reg X), OR harm exceeds the escalation threshold
    - the matter carries legal threat or high financial/credit harm
  evidence_needed: [harm_description, product, regulation_implicated]
  required_actions: [route to compliance, log escalation]
  exclusions: [routine single fee dispute within representative authority]
  regulation: regulation_x_or_udaap
