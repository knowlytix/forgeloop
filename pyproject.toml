[project]
name = "forgeloop"
version = "0.2.4"
description = "Companion library for the Beyond Prompt / Ship / Chunk and Pray trilogy — building, testing and grounding governed agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Knowlytix" }]
keywords = ["agents", "agentic-ai", "llm", "governance", "gms", "rag", "testing", "banking"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
]

# Core install is light; heavier and licensed pieces are optional extras.
# PyYAML is core: forgeloop.testing and forgeloop.apps load the bundled
# catalog/app YAML at import time.
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Open-weight model tools: classifiers, Qwen adapters, the draft LoRA.
ml = ["torch>=2.0", "transformers>=4.40", "peft>=0.10", "accelerate>=0.30"]
# Fetching the trained-artifact bundle from the Hugging Face Hub.
artifacts = ["huggingface_hub>=0.20"]
# GMS substrate (geometry, stores, DOE harness) — licensed, installed separately.
gms = ["knowlytix", "pandas"]
# The composed MCP server (forgeloop.mcp): knowlytix model-agnostic store tools +
# the governance/testing/ingest tools from the companion packages. mcp<2 pins the
# FastMCP-era SDK (2.0 renamed FastMCP -> MCPServer). transformers/accelerate are
# needed only for the opt-in model-backed rag_retrieve_compiled tool.
mcp = ["mcp>=1.26,<2", "knowlytix", "agentlab", "gmstest", "reasonloop",
       "transformers>=4.40", "accelerate>=0.30"]
anthropic = ["anthropic>=0.30"]
notebooks = ["jupyterlab", "matplotlib", "pandas"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "black"]
all = [
    "torch>=2.0", "transformers>=4.40", "peft>=0.10", "accelerate>=0.30",
    "huggingface_hub>=0.20", "anthropic>=0.30", "jupyterlab", "matplotlib", "pandas",
]

[project.scripts]
# Composed model-agnostic + forgeloop-tools MCP server (needs the [mcp] extra).
gms-mcp = "forgeloop.mcp:main"

[project.urls]
Homepage = "https://github.com/knowlytix/forgeloop"
Repository = "https://github.com/knowlytix/forgeloop"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forgeloop*"]

[tool.setuptools.package-data]
"forgeloop.catalogs" = ["*.yaml", "*.yml"]
"forgeloop.apps" = ["*.yaml", "*.yml"]
# The three books' chapter/capstone notebooks, plus the small data bundle
# (GMS stores, calibrations, pinned results and text inputs incl.
# banking_policy.md) ship with the package. The large model adapters do not.
forgeloop = [
    "notebooks/**/*.ipynb", "notebooks/**/*.py",
    "data/**/*", "data/*", "data/.forgeloop_book",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -v"

[tool.ruff]
line-length = 100
target-version = "py312"
