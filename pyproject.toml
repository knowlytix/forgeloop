[project]
name = "forgeloop"
version = "0.2.2"
description = "Companion library for the Beyond Prompt / Ship / Chunk and Pray trilogy — building, testing and grounding governed agents."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
authors = [{ name = "Knowlytix" }]
keywords = ["agents", "agentic-ai", "llm", "governance", "gms", "rag", "testing", "banking"]
classifiers = [
    "Programming Language :: Python :: 3.12",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: Other/Proprietary License",
    "Private :: Do Not Upload",
]

# Core install is light; heavier and licensed pieces are optional extras.
# PyYAML is core: forgeloop.testing and forgeloop.apps load the bundled
# catalog/app YAML at import time.
dependencies = [
    "pydantic>=2.0",
    "numpy",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Open-weight model tools: classifiers, Qwen adapters, the draft LoRA.
ml = ["torch>=2.0", "transformers>=4.40", "peft>=0.10", "accelerate>=0.30"]
# Fetching the trained-artifact bundle from the Hugging Face Hub.
artifacts = ["huggingface_hub>=0.20"]
# GMS substrate (geometry, stores, DOE harness) — licensed, installed separately.
gms = ["knowlytix", "pandas"]
anthropic = ["anthropic>=0.30"]
notebooks = ["jupyterlab", "matplotlib", "pandas"]
dev = ["pytest>=8.0", "pytest-cov", "ruff", "black"]
all = [
    "torch>=2.0", "transformers>=4.40", "peft>=0.10", "accelerate>=0.30",
    "huggingface_hub>=0.20", "anthropic>=0.30", "jupyterlab", "matplotlib", "pandas",
]

[project.urls]
Homepage = "https://github.com/knowlytix/forgeloop"
Repository = "https://github.com/knowlytix/forgeloop"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["forgeloop*"]

[tool.setuptools.package-data]
"forgeloop.catalogs" = ["*.yaml", "*.yml"]
"forgeloop.apps" = ["*.yaml", "*.yml"]
# The three books' chapter/capstone notebooks ship with the package.
forgeloop = ["notebooks/**/*.ipynb", "notebooks/**/*.py"]

[tool.ruff]
line-length = 100
target-version = "py312"
